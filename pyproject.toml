[project]
name = "jev-ultrafast"
version = "0.1.2"
description = "A browser agent that chooses instead of generating."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# No model client: AI requests go to the Nimi Host through the worker protocol.
# websockets closes the dedicated Chrome gracefully; its version is the one browser-harness pins.
dependencies = ["browser-harness==0.1.13", "websockets>=15,<16"]

[project.scripts]
jev-worker = "jev_ultrafast.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The fake transport is for renderer tests only; the Nimi Host provides the real one.
exclude = ["jev_ultrafast/static/dev-transport.mjs"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
